name: Deploy landing page
on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/landing-deploy.yml'
  workflow_dispatch:
concurrency:
  group: landing-deploy
env:
  DOMAIN_NAME: genie.kibalabs.com
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.SITE_DEPLOYER_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SITE_DEPLOYER_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.SITE_DEPLOYER_AWS_REGION }}
      - name: Sync to S3
        run: aws s3 sync --delete ./landing s3://${{ secrets.SITE_DEPLOYMENT_S3_BUCKET_NAME }}/${{ env.DOMAIN_NAME }}/
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.SITE_DEPLOYMENT_CLOUDFRONT_ID }} --paths "/${{ env.DOMAIN_NAME }}/*"
