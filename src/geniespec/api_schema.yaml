$schema: 'http://json-schema.org/draft-07/schema#'
$id: kibaRestApiSchema
type: object
additionalProperties: false
required:
  - version
  - serviceName
  - pythonClientPackageName
  - typescriptClientPackageName
properties:
  version:
    type: string
    pattern: '^([0-9]|[1-9][0-9]*)\.([0-9]|[1-9][0-9]*)\.([0-9]|[1-9][0-9]*)$'
  serviceName:
    type: string
    pattern: '^[a-z][a-z-]*$'
  pythonClientPackageName:
    type: string
    pattern: '^[a-z][-a-z]*$'
  typescriptClientPackageName:
    type: string
    pattern: '[@/-a-z]*$'
  transitions:
    type: array
    items:
      $ref: '#/definitions/RootTransition'
  resources:
    type: array
    items:
      $ref: '#/definitions/Resource'
  exceptions:
    type: array
    items:
      $ref: '#/definitions/Exception'
  imports:
    type: array
    items:
      type: string
  defaultAuthentication:
    type:
      - "null"
      - string
    pattern: '^[a-z][a-z0-9-]*$'
definitions:
  Attribute:
    type: object
    additionalProperties: false
    required:
      - name
      - type
    properties:
      name:
        type: string
        pattern: '^[a-z][A-Za-z0-9-]*$'
      type:
        type: string
        pattern: '^[A-Z][A-Za-z-\[\]_, ]*$'
      listValueTypes:
        type: array
        minItems: 1
        items:
          type: string
          pattern: '^[A-Z][A-Za-z-\[\]_, ]*$'
      isPrimary:
        type: boolean
      isUnique:
        type: boolean
      shouldDisableGetEndpoint:
        type: boolean
      isUnfilterable:
        type: boolean
      isUpdatable:
        type: boolean
      isNullable:
        type: boolean
      isDeprecated:
        type: boolean
      defaultValue:
        type:
          - string
          - number
          - boolean
          - 'null'
      isSettable:
        type: boolean
      isAccessibleIndependently:
        type: boolean
      mappingKeyType:
        type: string
        pattern: '^[A-Z][A-Za-z-\[\]_, ]*$'
      mappingValueTypes:
        type: array
        items:
          type: string
          pattern: '^[A-Z][A-Za-z-\[\]_, ]*$'
  Resource:
    type: object
    additionalProperties: false
    required:
      - singleName
      - collectionName
    properties:
      singleName:
        type: string
        pattern: '^[A-Z][A-Za-z-]*$'
      collectionName:
        type: string
        pattern: '^[A-Z][A-Za-z-]*$'
      parentResource:
        type: string
        pattern: '^[A-Z][A-Za-z-]*$'
      attributes:
        type: array
        items:
          $ref: '#/definitions/Attribute'
      transitions:
        type: array
        items:
          $ref: '#/definitions/Transition'
      accessibleFrom:
        type: array
        items:
          type: string
  BaseTransition:
    type: object
    additionalProperties: false
    required:
      - action
    properties:
      action:
        type: string
        pattern: '^[A-Z][A-Z-]*$'
      method:
        type: string
        enum:
          - GET
          - POST
      requestFields:
        type: array
        items:
          $ref: '#/definitions/RequestField'
      responseField:
        $ref: '#/definitions/ResponseField'
      authentication:
        type:
          - "null"
          - string
        pattern: '^[a-z][a-z0-9-]*$'
      responseType:
        type: string
        enum:
          - json
          - stream
          - redirect
  Transition:
    type: object
    additionalProperties: false
    required:
      - action
    properties:
      action:
        type: string
        pattern: '^[A-Z][A-Z-]*$'
      method:
        type: string
        enum:
          - GET
          - POST
      requestFields:
        type: array
        items:
          $ref: '#/definitions/RequestField'
      responseField:
        $ref: '#/definitions/ResponseField'
      authentication:
        type:
          - "null"
          - string
        pattern: '^[a-z][a-z0-9-]*$'
      responseType:
        type: string
        enum:
          - json
          - stream
          - redirect
      operatesOn:
        type: string
        enum:
          - individual
          - collection
      isIndirectAction:
        type: boolean
  RootTransition:
    type: object
    allOf:
      - $ref: '#/definitions/BaseTransition'
  RequestField:
    type: object
    additionalProperties: false
    required:
      - name
      - type
    properties:
      name:
        type: string
        pattern: '^[a-z][A-Za-z0-9-]*$'
      type:
        type: string
        pattern: '^[A-Z][A-Za-z-\[\]_, ]*$'
      listValueTypes:
        type: array
        minItems: 1
        items:
          type: string
          pattern: '^[A-Z][A-Za-z-\[\]_, ]*$'
      mappingKeyType:
        type: string
        pattern: '^[A-Z][A-Za-z-\[\]_, ]*$'
      mappingValueTypes:
        type: array
        items:
          type: string
          pattern: '^[A-Z][A-Za-z-\[\]_, ]*$'
      isRequired:
        type: boolean
      defaultValue:
        type:
          - string
          - number
          - boolean
          - 'null'
      isDeprecated:
        type: boolean
      maxValue:
        type:
          - string
          - number
      minValue:
        type:
          - string
          - number
      source:
        type: string
        enum:
          - request
          - query-parameters
  ResponseField:
    type: object
    additionalProperties: false
    required:
      - name
      - type
    properties:
      name:
        type: string
        pattern: '^[a-z][A-Za-z-]*$'
      type:
        type: string
        pattern: '^[A-Z][A-Za-z-\[\]_, ]*$'
      listValueTypes:
        type: array
        minItems: 1
        items:
          type: string
          pattern: '^[A-Z][A-Za-z-\[\]_, ]*$'
      mappingKeyType:
        type: string
        pattern: '^[A-Z][A-Za-z-\[\]_, ]*$'
      mappingValueTypes:
        type: array
        items:
          type: string
          pattern: '^[A-Z][A-Za-z-\[\]_, ]*$'
      isNullable:
        type: boolean
      isList:
        type: boolean
  Exception:
    type: object
    additionalProperties: false
    required:
      - name
    properties:
      name:
        type: string
        pattern: '^[A-Z][A-Za-z-]*Exception$'
      message:
        type: string
      extends:
        type: string
        pattern: '^([a-z-]+.exceptions.[A-Za-z-]*)|([A-Za-z-]*)'
      statusCode:
        type: integer
      fields:
        type: array
        items:
          $ref: '#/definitions/ExceptionField'
  ExceptionField:
    type: object
    additionalProperties: false
    required:
      - name
      - type
    properties:
      name:
        type: string
        pattern: '^[a-z][A-Za-z-]*$'
      type:
        type: string
        pattern: '^[A-Z][A-Za-z-\[\]_, ]*$'
      listValueTypes:
        type: array
        minItems: 1
        items:
          type: string
          pattern: '^[A-Z][A-Za-z-\[\]_, ]*$'
      isRequired:
        type: boolean
